name: Render Debug List Services

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: List services under all owners
        run: |
          set -euo pipefail
          API="https://api.render.com/v1"
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          echo "=== Owners ==="
          curl -s --max-time 60 -H "$AUTH" -H "Accept: application/json" "$API/owners" | jq -c '.[].owner | {id, name, type}'
          echo "=== Services (owner tea-d65nhip4tr6s73d6a5ng) ==="
          curl -s --max-time 60 -H "$AUTH" -H "Accept: application/json" "$API/services?ownerId=tea-d65nhip4tr6s73d6a5ng&limit=100" | \
            jq -c '.[].service | {id, name, type, suspended, (.serviceDetails | {plan, region, url})}' || echo "no services"
          echo "=== Services (all, no filter) ==="
          curl -s --max-time 60 -H "$AUTH" -H "Accept: application/json" "$API/services?limit=100" | \
            jq -c '.[].service | {id, name, type, suspended, svcPlan: (.serviceDetails.plan // ""), url: (.serviceDetails.url // "")}' || echo "none"